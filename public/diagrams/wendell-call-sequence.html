<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wendell phone call sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <script>
    // Embedded in the docs site the plate follows the host theme and fonts; opened
    // on its own it keeps its own paper, ink, and typefaces.
    const searchParams = new URLSearchParams(window.location.search);
    const isEmbedded = searchParams.has('embed');
    const preferredTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    const initialTheme = searchParams.get('theme') || preferredTheme;

    document.documentElement.dataset.theme = initialTheme === 'light' ? 'light' : 'dark';
    if (isEmbedded) document.documentElement.classList.add('embedded');

    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin || event.data?.type !== 'diagram-theme') return;
      document.documentElement.dataset.theme = event.data.theme === 'light' ? 'light' : 'dark';

      const fonts = event.data.fonts;
      if (fonts && typeof fonts === 'object') {
        for (const token of ['--sans', '--mono']) {
          if (typeof fonts[token] === 'string' && fonts[token].trim()) {
            document.documentElement.style.setProperty(token, fonts[token]);
          }
        }
      }
    });

    if (!isEmbedded && !searchParams.has('theme')) {
      window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', (event) => {
        document.documentElement.dataset.theme = event.matches ? 'light' : 'dark';
      });
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    /* Surfaces and ink track the host page. The no-script default is light, so a
       reader without JavaScript still gets a complete, readable plate. */
    :root,
    [data-theme="light"] {
      color-scheme: light;
      --color-paper: #ffffff;
      --color-ink: #353841;
      --color-muted: #555962;
      --color-soft: #7a7f89;
      --color-accent: #3d50f5;
      --color-accent-wash: rgba(61,80,245,0.08);
      --color-link: #0e7490;
      --color-rule: rgba(53,56,65,0.14);
      --color-line-strong: rgba(53,56,65,0.32);
      --color-lifeline: rgba(53,56,65,0.30);
      --color-node: rgba(255,255,255,0.94);
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --color-paper: #17181c;
      --color-ink: #e7e8ec;
      --color-muted: #c1c3c8;
      --color-soft: #888c96;
      --color-accent: #7390ff;
      --color-accent-wash: rgba(115,144,255,0.12);
      --color-link: #5bbad5;
      --color-rule: rgba(193,195,200,0.16);
      --color-line-strong: rgba(193,195,200,0.36);
      /* Swimlanes must stay legible on the dark surface, so they are raised well
         above the low-alpha rule colour used for the light theme. */
      --color-lifeline: rgba(193,195,200,0.44);
      --color-node: rgba(35,38,47,0.96);
    }
    :root {
      /* The host page pushes its own stacks in as --sans/--mono; standalone the
         plate keeps the faces it was drawn with. */
      --font-sans: var(--sans, 'Geist', system-ui, sans-serif);
      --font-mono: var(--mono, 'Geist Mono', ui-monospace, monospace);
      --motion-fast: 160ms;
      --motion-step: 480ms;
      --motion-hold: 720ms;
      --motion-total: 4320ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 32px;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
    }
    [data-motion-root] { width: min(100%, 1120px); }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 24px; font: 600 32px/1.15 var(--font-sans); }
    svg { display: block; width: 100%; min-width: 1120px; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. body is a centred
       grid, so the root needs max-width/min-width to stop the grid item from
       sizing itself to the SVG's max-content width. */
    [data-motion-root] { max-width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    /* Static source is complete. Only an initialized enhancement hides items. */
    .motion-ready [data-motion-item] {
      opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease);
    }
    .motion-ready [data-motion-item].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item],
    .motion-ready[data-frame="static"] [data-motion-item] {
      opacity: 1;
      transform: none;
    }
    /* Decorative overlays exist only while motion is running. Without this the
       flow token parks at the end of its travel and litters the finished frame. */
    .motion-ready[data-frame="end"] [data-motion-decorative] {
      opacity: 0;
    }
    .draw-path {
      fill: none;
      stroke: var(--color-accent);
      stroke-width: 3;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      pointer-events: none;
    }
    .motion-ready .draw-path.is-visible {
      animation: draw-path var(--motion-step) linear forwards;
    }
    .flow-token { opacity: 0; pointer-events: none; }
    .motion-ready.is-playing .flow-token.is-visible {
      opacity: 1;
      animation: token-flow 3.2s linear 1 forwards;
    }
    .motion-ready[data-motion-mode="loop"].is-playing .flow-token.is-visible {
      animation-iteration-count: infinite;
    }
    @keyframes draw-path { to { stroke-dashoffset: 0; } }
    @keyframes token-flow {
      0% { transform: translateX(0); }
      100% { transform: translateX(240px); }
    }

    [data-motion-controls] {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
    }
    .motion-ready [data-motion-controls] { display: flex; }
    [data-motion-controls][hidden] { display: none !important; }
    [data-motion-controls] button {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-paper);
      font: 600 12px/1 var(--font-sans);
      cursor: pointer;
    }
    [data-motion-controls] button:hover { border-color: var(--color-accent); }
    [data-motion-controls] button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }
    [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
    [data-motion-status-visible] {
      margin-left: auto;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    noscript p {
      margin: 12px 0 0;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }

    html[data-motion="static"] [data-motion-controls],
    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] [data-motion-item] {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important;
    }
    html[data-motion="step"] [data-motion-controls],
    html[data-motion="step"] [data-motion-decorative] { display: none !important; }
    html[data-motion="step"] [data-motion-item] {
      animation: none !important;
      transition: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      [data-motion-item] { opacity: 1 !important; transform: none !important; }
      [data-motion-decorative] { display: none !important; }
      [data-motion-controls] { display: none !important; }
    }
    @media print {
      /* Paper has no scrollbar, so the local scroller would clip instead of
         scroll. Let the diagram scale down to the sheet: smaller but whole
         beats sharp but cut off. */
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
      [data-motion-controls], [data-motion-decorative] { display: none !important; }
      [data-motion-item] {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important;
      }
    }
    /* The drawing carries literal colour attributes so it stands alone; these
       rules remap them onto the theme tokens without touching the geometry. */
    svg rect[fill="#f5f5f5"] { fill: var(--color-paper); }
    svg rect[fill="#ffffff"] { fill: var(--color-node); }
    svg rect[fill="rgba(191,69,32,0.08)"] { fill: var(--color-accent-wash); }
    svg rect[stroke="#2d3142"] { stroke: var(--color-line-strong); }
    svg rect[stroke="#bf4520"] { stroke: var(--color-accent); }
    /* The lifelines carry their stroke on the wrapping group, not on each line. */
    svg g[stroke="rgba(45,49,66,0.20)"] { stroke: var(--color-lifeline); }
    svg path[stroke="#bf4520"] { stroke: var(--color-accent); }
    svg path[stroke="#2e5aa8"] { stroke: var(--color-link); }
    svg path[stroke="#2d3142"] { stroke: var(--color-ink); }
    svg path[stroke="#4f5d75"] { stroke: var(--color-muted); }
    svg text[fill="#2d3142"] { fill: var(--color-ink); }
    svg text[fill="#5a6580"] { fill: var(--color-soft); }
    svg text[fill="#bf4520"] { fill: var(--color-accent); }
    svg text[fill="#2e5aa8"] { fill: var(--color-link); }
    svg marker polygon[fill="#4f5d75"] { fill: var(--color-muted); }
    svg marker polygon[fill="#bf4520"] { fill: var(--color-accent); }
    svg marker polygon[fill="#2e5aa8"] { fill: var(--color-link); }
    svg marker polygon[fill="#2d3142"] { fill: var(--color-ink); }
    svg text[font-family*="Geist Mono"] { font-family: var(--font-mono); }
    svg text[font-family*="Geist"] { font-family: var(--font-sans); }
    .draw-path { stroke: var(--color-accent); }

    /* Embedded: the host supplies the heading and the frame, so the plate drops
       its own chrome and scales to the frame instead of holding a fixed width. */
    .embedded body { padding: 0; }
    .embedded .eyebrow,
    .embedded h1 { display: none; }
    .embedded [data-motion-root] { width: 100%; max-width: none; }
    .embedded .diagram-container { overflow: hidden; }
    .embedded svg { min-width: 0; }
  </style>
</head>
<body>
  <main data-motion-root data-motion-mode="reveal" data-step-count="6" data-step-current="6" data-frame="static" data-static-frame="complete">
    <p class="eyebrow">Sequence · Inbound call</p>
    <h1>What happens when Wendell answers</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1120 940" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wendell-call-title wendell-call-desc">
        <title id="wendell-call-title">Wendell inbound phone call sequence</title>
        <desc id="wendell-call-desc">A customer dials the Twilio number. Twilio's webhook reaches the media bridge through the ngrok tunnel, the bridge checks the caller allowlist, loads that caller's own memory bank, and answers with media-stream TwiML carrying the caller number and call SID, and Twilio opens the media websocket. The bridge streams caller audio to the live voice model, which speaks back, and records the call. The bridge delegates the job details to the booking backend, which checks calendar availability and offers slots. The caller confirms, the calendar is written, and the bridge speaks the confirmation back down the line.</desc>
        <defs>
          <marker id="wendell-call-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="wendell-call-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="wendell-call-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
          <marker id="wendell-call-arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2d3142"/>
          </marker>
        </defs>
        <rect width="1120" height="940" fill="#f5f5f5"/>

        <!-- Lifelines run from the actors to just past the last message. -->
        <g stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3">
          <line x1="200" y1="176" x2="200" y2="888"/>
          <line x1="320" y1="176" x2="320" y2="888"/>
          <line x1="440" y1="176" x2="440" y2="888"/>
          <line x1="560" y1="176" x2="560" y2="888"/>
          <line x1="680" y1="176" x2="680" y2="888"/>
          <line x1="800" y1="176" x2="800" y2="888"/>
        </g>

        <!-- Persistent connectors: every message path is visible without motion. -->
        <g fill="none">
          <path d="M208 232 H312" stroke="#bf4520" stroke-width="1.2" marker-end="url(#wendell-call-arrow-accent)"/>
          <path d="M450 288 H552" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#wendell-call-arrow-link)"/>
          <path d="M552 344 H448" stroke="#2e5aa8" stroke-width="1" marker-end="url(#wendell-call-arrow-link)"/>
          <path d="M552 400 H448" stroke="#2d3142" stroke-width="1" marker-end="url(#wendell-call-arrow-ink)"/>
          <path d="M448 456 H552" stroke="#2d3142" stroke-width="1" marker-end="url(#wendell-call-arrow-ink)"/>
          <path d="M568 512 H672" stroke="#4f5d75" stroke-width="1" marker-end="url(#wendell-call-arrow)"/>
          <path d="M672 568 H568" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#wendell-call-arrow)"/>
          <!-- The bridge keeps its own per-caller bank in the local Hindsight
               service; nothing from that bank reaches the voice model. -->
          <path d="M560 356 H604 V380 H560" stroke="#4f5d75" stroke-width="1" marker-end="url(#wendell-call-arrow)"/>
          <path d="M568 624 H672" stroke="#4f5d75" stroke-width="1" marker-end="url(#wendell-call-arrow)"/>
          <path d="M800 680 H844 V704 H800" stroke="#4f5d75" stroke-width="1" marker-end="url(#wendell-call-arrow)"/>
          <path d="M672 736 H568" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#wendell-call-arrow)"/>
          <path d="M790 792 H690" stroke="#bf4520" stroke-width="1.2" marker-end="url(#wendell-call-arrow-accent)"/>
          <path d="M320 848 H208" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#wendell-call-arrow-ink)"/>
        </g>

        <!-- Actor boxes: caller and bridge are the two focal lanes. -->
        <g>
          <rect x="152" y="96" width="96" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
          <text x="200" y="116" text-anchor="middle" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.12em">CALLER</text>
          <text x="200" y="136" text-anchor="middle" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="11" font-weight="600">Customer</text>

          <rect x="272" y="96" width="96" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="320" y="116" text-anchor="middle" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.12em">EDGE</text>
          <text x="320" y="136" text-anchor="middle" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="11" font-weight="600">Twilio</text>

          <rect x="392" y="96" width="96" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="440" y="116" text-anchor="middle" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.12em">TUNNEL</text>
          <text x="440" y="136" text-anchor="middle" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="11" font-weight="600">ngrok</text>

          <rect x="512" y="96" width="96" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
          <text x="560" y="116" text-anchor="middle" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.12em">BRIDGE</text>
          <text x="560" y="136" text-anchor="middle" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="11" font-weight="600">Media bridge</text>

          <rect x="632" y="96" width="96" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="680" y="116" text-anchor="middle" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.12em">VOICE</text>
          <text x="680" y="136" text-anchor="middle" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="11" font-weight="600">GPT-Live</text>

          <rect x="752" y="96" width="96" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="800" y="116" text-anchor="middle" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.12em">BACKEND</text>
          <text x="800" y="136" text-anchor="middle" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="11" font-weight="600">Booking</text>
        </g>

        <!-- Step 1 · the call arrives -->
        <g data-motion-item data-step="1" aria-label="Step 1: the customer dials the Twilio number">
          <rect x="212" y="210" width="44" height="16" fill="#f5f5f5"/>
          <text x="216" y="222" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em">DIALS</text>
        </g>

        <!-- Step 2 · webhook accepted, caller on the allowlist, caller bank loaded -->
        <g data-motion-item data-step="2" aria-label="Step 2: the bridge receives the call webhook, checks the caller against the allowlist, and loads that caller's own memory bank">
          <rect x="454" y="266" width="48" height="16" fill="#f5f5f5"/>
          <text x="458" y="278" fill="#2e5aa8" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em">WEBHOOK</text>
          <rect x="454" y="322" width="68" height="16" fill="#f5f5f5"/>
          <text x="458" y="334" fill="#2e5aa8" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em">ALLOWLIST ✓</text>
          <rect x="616" y="360" width="42" height="16" fill="#f5f5f5"/>
          <text x="620" y="372" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em">BANK</text>
        </g>

        <!-- Step 3 · media stream negotiated -->
        <g data-motion-item data-step="3" aria-label="Step 3: the bridge answers with media-stream TwiML and Twilio opens the websocket">
          <rect x="454" y="378" width="40" height="16" fill="#f5f5f5"/>
          <text x="458" y="390" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em">TwiML</text>
          <rect x="454" y="434" width="62" height="16" fill="#f5f5f5"/>
          <text x="458" y="446" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em">WS · MEDIA</text>
        </g>

        <!-- Step 4 · audio exchange with the voice model -->
        <g data-motion-item data-step="4" aria-label="Step 4: caller audio streams to the live voice model, which speaks back">
          <rect x="572" y="490" width="72" height="16" fill="#f5f5f5"/>
          <text x="576" y="502" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em">AUDIO · PCMU</text>
          <rect x="572" y="546" width="42" height="16" fill="#f5f5f5"/>
          <text x="576" y="558" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em">SPEECH</text>
        </g>

        <!-- Step 5 · booking lookup -->
        <g data-motion-item data-step="5" aria-label="Step 5: the bridge delegates the job details and the backend reads calendar availability">
          <rect x="572" y="602" width="52" height="16" fill="#f5f5f5"/>
          <text x="576" y="614" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em">DELEGATE</text>
          <rect x="852" y="684" width="40" height="16" fill="#f5f5f5"/>
          <text x="856" y="696" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em">SLOTS</text>
        </g>

        <!-- Step 6 · confirmation, calendar write, spoken reply -->
        <g data-motion-item data-step="6" aria-label="Step 6: the caller confirms the slot, the calendar is written, and the bridge speaks the confirmation">
          <rect x="572" y="714" width="46" height="16" fill="#f5f5f5"/>
          <text x="576" y="726" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em">CONFIRM</text>
          <rect x="694" y="770" width="46" height="16" fill="#f5f5f5"/>
          <text x="698" y="782" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em">WRITTEN</text>
          <rect x="212" y="826" width="42" height="16" fill="#f5f5f5"/>
          <text x="216" y="838" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em">SPOKEN</text>
        </g>

        <!-- Decorative duplicate path and token never carry unique meaning. -->
        <path data-motion-item data-step="3" data-motion-decorative aria-hidden="true" focusable="false" pathLength="1" class="draw-path" d="M448 456 H552"/>
        <circle data-motion-item data-step="4" data-motion-decorative aria-hidden="true" focusable="false" class="flow-token" cx="568" cy="568" r="6" fill="#bf4520"/>
      </svg>
    </div>

    <div data-motion-controls role="group" aria-label="Diagram playback controls">
      <button type="button" data-motion-action="prev">Previous</button>
      <button type="button" data-motion-action="play" aria-pressed="false">Play</button>
      <button type="button" data-motion-action="pause" aria-pressed="true">Pause</button>
      <button type="button" data-motion-action="next">Next</button>
      <button type="button" data-motion-action="replay">Replay</button>
      <span class="keyboard-help">←/→ step · Space play/pause · R replay · Home/End jump</span>
      <span data-motion-status-visible aria-hidden="true">Step <span data-motion-step-label>6</span> of 6</span>
    </div>
    <p class="sr-only" data-motion-status role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p>Animation controls require JavaScript. The complete final diagram is shown above.</p></noscript>
  </main>

  <script data-diagram-controls>
    (() => {
      const params = new URLSearchParams(location.search);
      const staticOverride = params.get('motion') === 'static' || document.documentElement.dataset.motion === 'static';
      const requestedStep = params.get('step');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = 'true'; });

      document.querySelectorAll('[data-motion-root]').forEach((root) => {
        const count = Number(root.dataset.stepCount);
        const hold = parseFloat(getComputedStyle(root).getPropertyValue('--motion-hold')) || 720;
        const parsedStep = requestedStep !== null && /^\d+$/.test(requestedStep) ? Number(requestedStep) : null;
        const exactStep = params.get('motion') === 'step' && Number.isSafeInteger(parsedStep) && parsedStep >= 0 && parsedStep <= count ? parsedStep : null;
        const items = [...root.querySelectorAll('[data-motion-item]')];
        const labels = Array.from({ length: count + 1 }, (_, index) => index === 0
          ? 'Ready'
          : items.filter((item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step) === index)
              .map((item) => item.getAttribute('aria-label')).join('; '));
        const controls = root.querySelector('[data-motion-controls]');
        const status = root.querySelector('[data-motion-status]');
        const visibleStep = root.querySelector('[data-motion-step-label]');
        let step = count;
        let timer = 0;
        let playing = false;
        let stepBeforeReduce = 0;
        let resumeAfterReduce = root.dataset.motionMode === 'reveal';

        const buttons = (action) => controls.querySelector(`[data-motion-action="${action}"]`);
        const clearClock = () => { window.clearTimeout(timer); timer = 0; };
        const announce = () => { status.textContent = `Step ${step} of ${count}: ${labels[step] || 'Complete'}`; };
        const setControlsAvailable = (available) => {
          controls.hidden = !available;
          controls.setAttribute('aria-hidden', String(!available));
          controls.dataset.playbackDisabled = String(!available);
          controls.querySelectorAll('button').forEach((control) => { control.disabled = !available; });
        };

        function render(next, userInitiated = false) {
          step = Math.max(0, Math.min(count, next));
          root.dataset.stepCurrent = String(step);
          root.dataset.frame = step === count ? 'end' : step === 0 ? 'start' : 'step';
          items.forEach((item) => {
            const itemStep = Number(item.dataset.step);
            item.classList.toggle('is-visible', itemStep <= step);
            item.classList.toggle('is-current', itemStep === step);
          });
          if (visibleStep) visibleStep.textContent = String(step);
          const unavailable = controls.dataset.playbackDisabled === 'true';
          buttons('prev').disabled = unavailable || step === 0;
          buttons('next').disabled = unavailable || step === count;
          if (userInitiated) announce();
        }

        function pause(userInitiated = false) {
          clearClock();
          playing = false;
          root.classList.remove('is-playing');
          buttons('play').setAttribute('aria-pressed', 'false');
          buttons('pause').setAttribute('aria-pressed', 'true');
          if (userInitiated) status.textContent = `Paused at step ${step} of ${count}`;
        }

        function finish() {
          pause(false);
          root.dataset.frame = 'end';
          status.textContent = `Complete · step ${count} of ${count}`;
        }

        function tick() {
          if (!playing) return;
          if (step >= count) { finish(); return; }
          render(step + 1, false);
          if (step >= count) { finish(); return; }
          timer = window.setTimeout(tick, hold);
        }

        function play(fromStart = false, userInitiated = false) {
          clearClock();
          if (fromStart || step >= count) render(0, userInitiated);
          playing = true;
          root.classList.add('is-playing');
          buttons('play').setAttribute('aria-pressed', 'true');
          buttons('pause').setAttribute('aria-pressed', 'false');
          timer = window.setTimeout(tick, hold);
        }

        controls.addEventListener('click', (event) => {
          const button = event.target.closest('[data-motion-action]');
          if (!button) return;
          const action = button.dataset.motionAction;
          if (action === 'play') play(false, true);
          if (action === 'pause') pause(true);
          if (action === 'replay') play(true, true);
          if (action === 'prev') { pause(false); render(step - 1, true); }
          if (action === 'next') { pause(false); render(step + 1, true); }
        });

        root.addEventListener('keydown', (event) => {
          if (event.target.matches('input, textarea, select, a[href]')) return;
          const keys = { ArrowLeft: step - 1, ArrowRight: step + 1, Home: 0, End: count };
          if (event.code === 'Space' && !event.target.closest('button')) {
            event.preventDefault();
            playing ? pause(true) : play(false, true);
            return;
          }
          if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'r') {
            event.preventDefault();
            play(true, true);
            return;
          }
          if (!(event.key in keys)) return;
          event.preventDefault();
          pause(false);
          render(keys[event.key], true);
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden' && playing) pause(false);
        });
        reduce.addEventListener('change', (event) => {
          if (event.matches && root.dataset.motionState !== 'reduced') {
            stepBeforeReduce = step;
            resumeAfterReduce = playing;
          }
          pause(false);
          if (event.matches) {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'reduced';
            status.textContent = 'Reduced motion · complete static frame · playback controls unavailable';
          } else if (staticOverride || root.dataset.motionMode === 'none') {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'static';
            status.textContent = 'Static frame · complete diagram · playback controls unavailable';
          } else {
            delete root.dataset.motionState;
            if (exactStep !== null) {
              setControlsAvailable(false);
              render(exactStep, false);
              root.dataset.frame = 'step';
              root.dataset.motionState = 'test';
              status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
            } else {
              setControlsAvailable(true);
              render(stepBeforeReduce, false);
              status.textContent = `Ready · step ${step} of ${count}`;
              if (resumeAfterReduce && root.dataset.motionMode === 'reveal') {
                play(false, false);
              }
            }
            resumeAfterReduce = false;
          }
        });

        if (staticOverride) {
          document.documentElement.dataset.motion = 'static';
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = 'Static frame · complete diagram · playback controls unavailable';
        } else if (reduce.matches || root.dataset.motionMode === 'none') {
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
          status.textContent = reduce.matches
            ? 'Reduced motion · complete static frame · playback controls unavailable'
            : 'Static frame · complete diagram · playback controls unavailable';
        } else if (exactStep !== null) {
          document.documentElement.dataset.motion = 'step';
          pause(false);
          setControlsAvailable(false);
          render(exactStep, false);
          root.dataset.frame = 'step';
          root.dataset.motionState = 'test';
          status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
        } else if (root.dataset.motionMode === 'reveal') {
          setControlsAvailable(true);
          render(0, false);
          play(false, false);
        } else {
          pause(false);
          setControlsAvailable(true);
          render(0, false);
          status.textContent = `Ready · step 0 of ${count}`;
        }
        root.classList.add('motion-ready');
      });
    })();
  </script>
</body>
</html>
